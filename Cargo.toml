[workspace]
resolver = "2"
members = [
    "crates/vijeo-dat",
    "crates/vijeo-core",
    "crates/vijeo-ui",
    "crates/vijeo-backend-vd63",
    "crates/vijeo-mcp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
publish = false

[workspace.dependencies]
vijeo-dat = { path = "crates/vijeo-dat" }
vijeo-core = { path = "crates/vijeo-core" }
vijeo-ui = { path = "crates/vijeo-ui" }
vijeo-backend-vd63 = { path = "crates/vijeo-backend-vd63" }

rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-std", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
roxmltree = "0.20"
cfb = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
