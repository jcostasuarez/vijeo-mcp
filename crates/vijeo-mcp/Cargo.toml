[package]
name = "vijeo-mcp"
description = "Servidor MCP (stdio) para Vijeo-Designer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vijeo-mcp"
path = "src/main.rs"

[dependencies]
vijeo-core.workspace = true
# Sólo para descubrir instalaciones y registrar backends (raíz de composición, main.rs).
vijeo-ui.workspace = true
vijeo-backend-vd63.workspace = true
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
schemars = "1"

[features]
# Pruebas que lanzan Vijeo-Designer de verdad.
live-vijeo = []
